# Builds the site from main and deploys it to production on Cloudflare Pages.
# Runs only the repository's own code; never pull request code.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PAGES_PROJECT: ground-truth
  WRANGLER: wrangler@4.158.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check that Cloudflare is set up
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then echo "ready=true" >> "$GITHUB_OUTPUT"; else echo "::notice::Cloudflare is not set up yet (docs/DEPLOY.md), so nothing is deployed."; fi
      - if: steps.cf.outputs.ready == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history, for the credits on each page
          persist-credentials: false
      - if: steps.cf.outputs.ready == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - if: steps.cf.outputs.ready == 'true'
        run: npm ci
      - if: steps.cf.outputs.ready == 'true'
        run: npm run validate
      - name: Build the site, with contributors' GitHub handles
        if: steps.cf.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run build:site -- --github
      - name: Deploy to production
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "$WRANGLER" pages deploy dist/site --project-name "$PAGES_PROJECT" --branch main --commit-hash "$GITHUB_SHA" --commit-dirty=true
